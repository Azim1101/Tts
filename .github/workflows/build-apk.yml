name: Build DhVaani APK

# Build the debug APK on push / PR / manual trigger using a single
# ubuntu-latest runner with JDK 17 + Android SDK 34 + NDK + CMake + Gradle 8.7.
#
# MNN 3.6.1 prebuilt binaries and headers are fetched via scripts/fetch_mnn.sh,
# and the models are downloaded from https://huggingface.co/Bbkblo/DhVaani-0.5-MNN
# via scripts/download_models.sh before building.
#
# Publishing a Release: push a version tag (e.g. `git tag v1.0.0 && git push --tags`)
# -> the APK is attached to a GitHub Release with a permanent `releases/latest` URL.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: dhvaani-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 34, build-tools, CMake, NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.3.11579264" || true

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          NDK_DIR="$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$NDK_DIR" ]; then
            echo "ndk.dir=$NDK_DIR" >> local.properties
          fi
          cat local.properties

      - name: Install Gradle 8.7 and put on PATH
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
          export PATH="/opt/gradle-8.7/bin:$PATH"
          gradle --version

      - name: Install python deps (numpy, huggingface_hub)
        run: python3 -m pip install --quiet numpy huggingface_hub

      - name: Fetch MNN prebuilts and headers
        run: bash scripts/fetch_mnn.sh

      - name: Download MNN models into assets
        continue-on-error: true
        run: bash scripts/download_models.sh

      - name: Build debug APK
        run: |
          gradle assembleDebug --stacktrace --info
          echo "--- APK locations ---"
          find app/build/outputs -type f -name '*.apk' 2>/dev/null || echo "(no apk found)"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhvaani-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Publish a GitHub Release (permanent URL) when a v* tag is pushed.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dhvaani-debug-apk
          path: release-artifacts

      - name: List downloaded APK
        run: find release-artifacts -type f -name '*.apk' -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DhVaani ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **DhVaani** — on-device, fully offline Hindi voice cloner (debug APK with MNN v1.1 engine).

            ## Download
            - `${{ github.ref_name }}` — [app-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-debug.apk) (~140 MB, arm64-v8a)

            ## Notes
            - Built with the high-performance **MNN 3.6.1** C++ engine and **DhVaani-0.5-MNN v1.1** models.
            - Fast fp16 NEON acceleration on arm64 devices.
            - On first launch, if models are not bundled, the app downloads them directly into private storage from Hugging Face and works fully offline.
          files: release-artifacts/**/*.apk
